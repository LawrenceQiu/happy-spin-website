<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Spin Table Tennis Academy | Learn. Play. Enjoy. Improve.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --orange: #E8610A;
      --navy: #1B3A8C;
      --blue: #4BA3D3;
      --white: #F8F7F4;
      --dark: #111827;
      --muted: #6B7280;
      --card-bg: #FFFFFF;
      --section-alt: #F0F4FF;
    }
    html { scroll-behavior: smooth; }
    body { font-family: 'DM Sans', sans-serif; background: var(--white); color: var(--dark); overflow-x: hidden; }
    h1, h2, h3, h4 { font-family: 'Barlow Condensed', sans-serif; }
    a { text-decoration: none; color: inherit; }


    /* MOBILE STICKY CTA */
    .mobile-sticky-cta {
      display: none;
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 90;
      background: white; padding: 12px 20px;
      box-shadow: 0 -4px 20px rgba(0,0,0,.12);
      border-top: 2px solid var(--orange);
    }
    .mobile-sticky-cta button { width: 100%; }
    @media (max-width: 768px) { .mobile-sticky-cta { display: block; } }

    /* NAV */
    .nav {
      position: sticky; top: 0; z-index: 100;
      background: rgba(255,255,255,0.97); backdrop-filter: blur(8px);
      border-bottom: 2px solid var(--orange);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 5vw; height: 68px;
    }
    .nav-logo { display: flex; align-items: center; gap: 10px; }
    .nav-logo img { height: 48px; width: 48px; object-fit: contain; }
    .nav-brand { font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 800; color: var(--orange); line-height: 1; }
    .nav-brand span { display: block; font-size: 11px; font-weight: 500; color: var(--navy); letter-spacing: .08em; text-transform: uppercase; }
    .nav-links { display: flex; gap: 28px; align-items: center; }
    .nav-links a { font-size: 14px; font-weight: 500; color: var(--navy); transition: color .2s; }
    .nav-links a:hover { color: var(--orange); }
    .btn-nav { background: var(--orange); color: white; padding: 9px 22px; border-radius: 50px; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600; border: none; cursor: pointer; transition: background .2s, transform .15s; }
    .btn-nav:hover { background: #c9520a; transform: scale(1.03); }
    .nav-mobile-btn { display: none; background: none; border: none; cursor: pointer; padding: 4px; }
    .hamburger { width: 24px; height: 18px; display: flex; flex-direction: column; justify-content: space-between; }
    .hamburger span { display: block; height: 2px; background: var(--navy); border-radius: 2px; transition: all .3s; }
    @media (max-width: 768px) {
      .nav-links { display: none; }
      .nav-mobile-btn { display: block; }
    }

    /* MOBILE MENU */
    .mobile-menu {
      position: fixed; inset: 0; z-index: 200; background: var(--navy);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 32px; transform: translateX(100%); transition: transform .35s cubic-bezier(.4,0,.2,1);
    }
    .mobile-menu.open { transform: translateX(0); }
    .mobile-menu a { font-family: 'Barlow Condensed', sans-serif; font-size: 36px; font-weight: 700; color: white; letter-spacing: .02em; }
    .mobile-menu a:hover { color: var(--orange); }
    .mobile-close { position: absolute; top: 20px; right: 20px; background: none; border: none; color: white; font-size: 32px; cursor: pointer; }

    /* HERO */
    .hero {
      min-height: calc(100vh - 68px);
      background: linear-gradient(135deg, var(--white) 55%, #ddeeff 100%);
      display: grid; grid-template-columns: 1fr 1fr; align-items: center;
      gap: 40px; padding: 60px 5vw 40px;
      position: relative; overflow: hidden;
    }
    .hero::before {
      content: ''; position: absolute; bottom: -60px; left: -60px;
      width: 320px; height: 320px; border-radius: 50%;
      background: oklch(0.92 0.05 250); z-index: 0;
    }
    .hero-content { position: relative; z-index: 1; }
    .hero-badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: oklch(0.97 0.02 40); border: 1px solid oklch(0.85 0.05 40);
      color: var(--orange); font-size: 13px; font-weight: 600;
      padding: 5px 14px; border-radius: 50px; margin-bottom: 20px;
      letter-spacing: .04em; text-transform: uppercase;
    }
    .hero-title {
      font-size: clamp(48px, 7vw, 86px); font-weight: 900; line-height: 0.95;
      color: var(--navy); margin-bottom: 8px;
    }
    .hero-title .orange { color: var(--orange); }
    .hero-sub {
      font-size: clamp(16px, 2vw, 20px); color: var(--muted); font-weight: 400;
      margin: 20px 0 36px; max-width: 440px; line-height: 1.6;
    }
    .hero-ctas { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 40px; }
    .btn-primary {
      background: var(--orange); color: white; padding: 16px 32px;
      border-radius: 50px; font-size: 16px; font-weight: 600; border: none;
      cursor: pointer; transition: background .2s, transform .15s, box-shadow .2s;
      box-shadow: 0 4px 20px rgba(232,97,10,.35);
    }
    .btn-primary:hover { background: #c9520a; transform: translateY(-2px); box-shadow: 0 8px 28px rgba(232,97,10,.45); }
    .btn-secondary {
      background: transparent; color: var(--navy); padding: 16px 32px;
      border-radius: 50px; font-size: 16px; font-weight: 600;
      border: 2px solid var(--navy); cursor: pointer;
      transition: all .2s;
    }
    .btn-secondary:hover { background: var(--navy); color: white; }
    .hero-trust { display: flex; gap: 24px; flex-wrap: wrap; }
    .hero-trust-item { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
    .hero-trust-icon { width: 32px; height: 32px; border-radius: 50%; background: var(--navy); display: flex; align-items: center; justify-content: center; color: white; font-size: 14px; flex-shrink: 0; }
    .hero-image-wrap { position: relative; z-index: 1; display: flex; justify-content: center; align-items: center; }
    .hero-image-wrap img { width: 100%; max-width: 500px; filter: drop-shadow(0 20px 60px rgba(27,58,140,.15)); animation: float 4s ease-in-out infinite; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
    .hero-dots { position: absolute; top: 30px; right: 30px; display: flex; flex-direction: column; gap: 8px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; }
    @media (max-width: 768px) {
      .hero { grid-template-columns: 1fr; padding: 40px 5vw 60px; text-align: center; min-height: auto; }
      .hero-image-wrap { order: -1; }
      .hero-image-wrap img { max-width: 280px; }
      .hero-ctas { justify-content: center; }
      .hero-trust { justify-content: center; }
    }

    /* MARQUEE */
    .marquee-wrap { background: var(--navy); padding: 14px 0; overflow: hidden; }
    .marquee-track { display: flex; gap: 0; animation: marquee 20s linear infinite; white-space: nowrap; }
    .marquee-item { font-family: 'Barlow Condensed', sans-serif; font-size: 17px; font-weight: 700; color: white; letter-spacing: .06em; text-transform: uppercase; padding: 0 32px; }
    .marquee-item .dot-sep { color: var(--orange); margin-right: 32px; }
    @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }

    /* TRUST BAR */
    .trust-bar { background: var(--card-bg); padding: 56px 5vw; }
    .trust-bar-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; max-width: 1100px; margin: 0 auto; }
    .trust-card {
      display: flex; flex-direction: column; align-items: center; text-align: center;
      gap: 14px; padding: 28px 20px; border-radius: 16px;
      border: 1.5px solid #E5E7EB; transition: border-color .2s, box-shadow .2s;
    }
    .trust-card:hover { border-color: var(--orange); box-shadow: 0 4px 20px rgba(232,97,10,.1); }
    .trust-icon { width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; }
    .trust-icon.orange { background: var(--orange); }
    .trust-icon.navy { background: var(--navy); }
    .trust-icon.blue { background: var(--blue); }
    .trust-title { font-family: 'Barlow Condensed', sans-serif; font-size: 18px; font-weight: 800; color: var(--navy); text-transform: uppercase; letter-spacing: .04em; }
    .trust-desc { font-size: 14px; color: var(--muted); line-height: 1.5; }
    @media (max-width: 900px) { .trust-bar-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 480px) { .trust-bar-grid { grid-template-columns: 1fr; } }

    /* SECTION HEADERS */
    .section-label { font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 700; letter-spacing: .15em; text-transform: uppercase; color: var(--orange); margin-bottom: 10px; }
    .section-title { font-family: 'Barlow Condensed', sans-serif; font-size: clamp(34px, 5vw, 52px); font-weight: 900; color: var(--navy); line-height: 1.05; }
    .section-body { font-size: 17px; color: var(--muted); line-height: 1.7; max-width: 600px; margin-top: 14px; }

    /* STAT STRIP */
    .stat-strip { background: var(--navy); padding: 36px 5vw; color: white; }
    .stat-strip-inner { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; align-items: center; }
    .stat-item { text-align: center; padding: 0 8px; position: relative; }
    .stat-item + .stat-item::before { content: ''; position: absolute; left: 0; top: 14%; bottom: 14%; width: 1px; background: rgba(255,255,255,.18); }
    .stat-num { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: clamp(36px, 5vw, 52px); line-height: 1; color: white; letter-spacing: -.01em; }
    .stat-num .accent { color: var(--orange); }
    .stat-label { font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; color: rgba(255,255,255,.78); margin-top: 8px; line-height: 1.4; letter-spacing: .02em; }
    @media (max-width: 768px) {
      .stat-strip-inner { grid-template-columns: repeat(2, 1fr); gap: 28px 12px; }
      .stat-item + .stat-item::before { display: none; }
    }

    /* COACHES */
    .coaches { padding: 80px 5vw; background: var(--card-bg); }
    .coaches-inner { max-width: 1100px; margin: 0 auto; }
    .coaches-header { text-align: center; max-width: 720px; margin: 0 auto 44px; }
    .coaches-grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: 32px; align-items: stretch; }
    .creds-card {
      background: linear-gradient(160deg, var(--navy), #15306e);
      color: white; border-radius: 24px; padding: 36px 32px;
      box-shadow: 0 12px 36px rgba(27,58,140,.18);
      position: relative; overflow: hidden;
    }
    .creds-card::after {
      content: '🏓'; position: absolute; right: -20px; bottom: -30px;
      font-size: 180px; opacity: .06; transform: rotate(-12deg);
    }
    .creds-eyebrow { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--orange); margin-bottom: 14px; }
    .creds-title { font-family: 'Barlow Condensed', sans-serif; font-size: 36px; font-weight: 900; line-height: 1.05; margin-bottom: 18px; }
    .creds-list { display: flex; flex-direction: column; gap: 14px; position: relative; z-index: 1; }
    .creds-list li { display: flex; gap: 14px; align-items: flex-start; list-style: none; font-size: 15px; line-height: 1.55; color: rgba(255,255,255,.92); }
    .creds-list .icon {
      flex-shrink: 0; width: 32px; height: 32px; border-radius: 50%;
      background: rgba(232,97,10,.18); border: 1.5px solid var(--orange);
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
    }
    .creds-list strong { color: white; font-weight: 700; }
    .vibes-card {
      background: var(--section-alt); border-radius: 24px; padding: 36px 32px;
      display: flex; flex-direction: column; justify-content: center;
      border: 1.5px solid rgba(27,58,140,.08);
    }
    .vibes-eyebrow { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--navy); margin-bottom: 14px; }
    .vibes-title { font-family: 'Barlow Condensed', sans-serif; font-size: 32px; font-weight: 900; line-height: 1.1; color: var(--dark); margin-bottom: 14px; }
    .vibes-title em { font-style: normal; color: var(--orange); }
    .vibes-body { color: var(--muted); font-size: 15px; line-height: 1.65; margin-bottom: 18px; }
    .vibes-tags { display: flex; flex-wrap: wrap; gap: 8px; }
    .vibes-tag { background: white; color: var(--navy); font-size: 13px; font-weight: 600; padding: 6px 14px; border-radius: 50px; border: 1.5px solid rgba(27,58,140,.12); }
    @media (max-width: 768px) {
      .coaches { padding: 60px 5vw; }
      .coaches-grid { grid-template-columns: 1fr; gap: 18px; }
      .creds-card, .vibes-card { padding: 28px 22px; }
      .creds-title { font-size: 28px; }
      .vibes-title { font-size: 26px; }
    }

    /* ABOUT */
    .about { padding: 80px 5vw; background: var(--section-alt); }
    .about-inner { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: center; }
    .about-image { border-radius: 24px; overflow: hidden; position: relative; }
    .about-image img { width: 100%; display: block; border-radius: 24px; }
    .about-badge {
      position: absolute; bottom: 24px; left: 24px;
      background: var(--orange); color: white; border-radius: 12px; padding: 14px 20px;
      font-family: 'Barlow Condensed', sans-serif;
    }
    .about-badge .num { font-size: 36px; font-weight: 900; display: block; }
    .about-badge .label { font-size: 13px; font-weight: 600; opacity: .9; }
    .about-list { list-style: none; margin-top: 28px; display: flex; flex-direction: column; gap: 14px; }
    .about-list li { display: flex; align-items: flex-start; gap: 12px; font-size: 16px; color: var(--dark); }
    .about-list li::before { content: '✓'; display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; min-width: 24px; border-radius: 50%; background: var(--orange); color: white; font-size: 13px; font-weight: 700; margin-top: 1px; }
    @media (max-width: 768px) { .about-inner { grid-template-columns: 1fr; } }

    /* TESTIMONIALS */
    .testimonials { padding: 80px 5vw; background: var(--card-bg); }
    .testimonials-inner { max-width: 1100px; margin: 0 auto; }
    .testimonials-header { text-align: center; margin-bottom: 48px; }
    .testimonials-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
    .tcard {
      background: var(--white); border-radius: 16px; padding: 28px 24px;
      border: 1.5px solid #E5E7EB; transition: box-shadow .2s;
    }
    .tcard:hover { box-shadow: 0 8px 32px rgba(27,58,140,.1); }
    .tcard-stars { color: #FBBF24; font-size: 18px; margin-bottom: 14px; letter-spacing: 2px; }
    .tcard-quote { font-size: 15px; line-height: 1.65; color: var(--dark); margin-bottom: 20px; font-style: italic; }
    .tcard-author { display: flex; align-items: center; gap: 12px; }
    .tcard-avatar { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 18px; color: white; }
    .tcard-name { font-weight: 600; font-size: 14px; }
    .tcard-role { font-size: 13px; color: var(--muted); }
    @media (max-width: 768px) { .testimonials-grid { grid-template-columns: 1fr; } }

    /* PROGRAMS */
    .programs { padding: 80px 5vw; background: var(--section-alt); }
    .programs-inner { max-width: 1100px; margin: 0 auto; }
    .programs-header { text-align: center; margin-bottom: 48px; }
    .programs-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
    .pcard {
      background: white; border-radius: 20px; padding: 36px 28px;
      border: 2px solid transparent; position: relative; overflow: hidden;
      transition: all .25s; cursor: default;
    }
    .pcard:hover { transform: translateY(-6px); box-shadow: 0 16px 48px rgba(27,58,140,.15); }
    .pcard.featured { border-color: var(--orange); }
    .pcard-badge {
      position: absolute; top: 20px; right: 20px;
      background: var(--orange); color: white; font-size: 11px; font-weight: 700;
      letter-spacing: .08em; text-transform: uppercase; padding: 4px 12px; border-radius: 20px;
    }
    .pcard-icon { font-size: 40px; margin-bottom: 16px; }
    .pcard-title { font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 900; color: var(--navy); text-transform: uppercase; margin-bottom: 6px; }
    .pcard-subtitle { font-size: 14px; color: var(--muted); margin-bottom: 20px; }
    .pcard-features { list-style: none; display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
    .pcard-features li { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--dark); }
    .pcard-features li::before { content: '●'; color: var(--orange); font-size: 8px; flex-shrink: 0; }
    .pcard-cta {
      display: block; text-align: center;
      background: var(--navy); color: white; padding: 12px 24px;
      border-radius: 50px; font-size: 14px; font-weight: 600;
      border: none; cursor: pointer; transition: background .2s;
      width: 100%;
    }
    .pcard-cta:hover { background: var(--orange); }
    .pcard.featured .pcard-cta { background: var(--orange); }
    .pcard.featured .pcard-cta:hover { background: #c9520a; }
    @media (max-width: 900px) { .programs-grid { grid-template-columns: 1fr; max-width: 520px; margin: 0 auto; } }

    /* HOW IT WORKS */
    .hiw { padding: 80px 5vw; background: var(--navy); }
    .hiw-inner { max-width: 1000px; margin: 0 auto; text-align: center; }
    .hiw .section-title { color: white; }
    .hiw .section-body { color: rgba(255,255,255,.7); margin: 0 auto; }
    .hiw-steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; margin-top: 56px; position: relative; }
    .hiw-steps::before {
      content: ''; position: absolute; top: 36px; left: 16.5%; right: 16.5%;
      height: 2px; background: rgba(255,255,255,.2);
    }
    .hiw-step { display: flex; flex-direction: column; align-items: center; gap: 16px; }
    .hiw-num {
      width: 72px; height: 72px; border-radius: 50%; border: 3px solid var(--orange);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Barlow Condensed', sans-serif; font-size: 32px; font-weight: 900;
      color: var(--orange); background: var(--navy); position: relative; z-index: 1;
    }
    .hiw-step-title { font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 800; color: white; text-transform: uppercase; }
    .hiw-step-desc { font-size: 15px; color: rgba(255,255,255,.65); line-height: 1.6; }
    @media (max-width: 640px) {
      .hiw-steps { grid-template-columns: 1fr; }
      .hiw-steps::before { display: none; }
    }

    /* SCHEDULE */
    .schedule { padding: 80px 5vw; background: var(--card-bg); }
    .schedule-inner { max-width: 900px; margin: 0 auto; }
    .schedule-header { text-align: center; margin-bottom: 48px; }
    .schedule-table { width: 100%; border-collapse: collapse; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 24px rgba(0,0,0,.06); }
    .schedule-table th { background: var(--navy); color: white; padding: 16px 20px; text-align: left; font-family: 'Barlow Condensed', sans-serif; font-size: 16px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
    .schedule-table td { padding: 14px 20px; border-bottom: 1px solid #F3F4F6; font-size: 15px; }
    .schedule-table tr:last-child td { border-bottom: none; }
    .schedule-table tr:nth-child(even) td { background: var(--section-alt); }
    .sched-tag {
      display: inline-block; padding: 3px 10px; border-radius: 12px;
      font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
    }
    .sched-tag.kids { background: oklch(0.92 0.08 30); color: oklch(0.45 0.14 30); }
    .sched-tag.beginner { background: oklch(0.92 0.08 250); color: var(--navy); }
    .sched-tag.intermediate { background: oklch(0.92 0.07 150); color: oklch(0.35 0.12 150); }
    .sched-tag.all { background: oklch(0.92 0.05 290); color: oklch(0.35 0.1 290); }
    .spots-chip { display: inline-flex; align-items: center; gap: 5px; background: oklch(0.95 0.04 30); color: var(--orange); font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 12px; }
    .spots-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--orange); animation: pulse 1.5s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }
    .schedule-note { text-align: center; margin-top: 28px; font-size: 14px; color: var(--muted); }

                <textarea placeholder={t.mElsePh} value={formData.message} onChange={(e) => setFormData({ ...formData, message: e.target.value })}></textarea>
              </div>
              <button type="submit" className="btn-primary" style={{ width: '100%', fontSize: '16px', padding: '16px' }}>{t.mSubmit}</button>
              <p style={{ textAlign: 'center', fontSize: '13px', color: 'var(--muted)', marginTop: '12px' }}>{t.mOrCall}<a href="tel:0433883078" style={{ color: 'var(--orange)', fontWeight: 600 }}>0433 883 078</a></p>
            </form>
          }
        </div>
      </div>

      {/* MOBILE STICKY CTA */}
      <div className="mobile-sticky-cta">
        <button className="btn-primary" onClick={() => { setModalOpen(true); setFormStep('form'); }}>{t.stickyCta}</button>
      </div>

      {/* LIGHTBOX */}
      <div className={`lightbox-overlay ${lightboxSrc ? 'open' : ''}`} onClick={closeLightbox}>
        <button className="lightbox-close" onClick={closeLightbox}>✕</button>
        {lightboxSrc && <img src={lightboxSrc} alt="Preview" className="lightbox-img" onClick={(e) => e.stopPropagation()} />}
      </div>

      {/* TWEAKS */}
      <TweaksPanel>
        <window.TweakSection title="Language">
          <window.TweakRadio label="Language" value={lang} options={[{ label: 'English', value: 'en' }, { label: '简体中文', value: 'zh' }]} onChange={(v) => setTweak('language', v)} />
        </window.TweakSection>
        <window.TweakSection title="Brand">
          <window.TweakColor label="Accent Color" value={tweaks.accentColor} onChange={(v) => setTweak('accentColor', v)} />
          <window.TweakToggle label="Show Chinese tagline" checked={tweaks.showChinese} onChange={(v) => setTweak('showChinese', v)} />
        </window.TweakSection>
        <window.TweakSection title="Social Proof">
          <window.TweakSlider label="Testimonials shown" min={1} max={6} step={1} value={tweaks.testimonialCount} onChange={(v) => setTweak('testimonialCount', v)} />
        </window.TweakSection>
      </TweaksPanel>
    </>);

}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
